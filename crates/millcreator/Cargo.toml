[package]
name = "millcreator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MillCreator: open-source CNC milling software: layers, bits, toolpaths, 3D view and G-code"

[dependencies]
base-core = { git = "https://github.com/michalsarna/baseCreator", tag = "v0.8.1" }
base-ui = { git = "https://github.com/michalsarna/baseCreator", tag = "v0.8.1" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "0.36"

[features]
# Live camera capture, passed on to base-ui: cargo run --features camera
camera = ["base-ui/camera"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "MillCreator"
identifier = "io.github.michalsarna.millcreator"
icon = ["../../assets/icons/icon-256.png", "../../assets/icons/icon-512.png"]
short_description = "Open-source CNC milling software"

[package.metadata.bundle.osx]
minimum_system_version = "11.0"

[package.metadata.deb]
name = "millcreator"
maintainer = "MillCreator contributors <noreply@github.com>"
section = "graphics"
priority = "optional"
# The GUI loads libxkbcommon-x11 and libGL at run time, so list them explicitly.
depends = "$auto, libxkbcommon-x11-0, libgl1"
extended-description = "Design shapes, set layers, bits and material, see the job in 3D and write G-code for CNC milling."
assets = [
  ["target/release/millcreator", "usr/bin/", "755"],
  ["../../assets/millcreator.desktop", "usr/share/applications/", "644"],
  ["../../assets/icons/icon-48.png", "usr/share/icons/hicolor/48x48/apps/millcreator.png", "644"],
  ["../../assets/icons/icon-128.png", "usr/share/icons/hicolor/128x128/apps/millcreator.png", "644"],
  ["../../assets/icons/icon-256.png", "usr/share/icons/hicolor/256x256/apps/millcreator.png", "644"],
  ["../../assets/icons/icon-512.png", "usr/share/icons/hicolor/512x512/apps/millcreator.png", "644"],
  ["../../README.md", "usr/share/doc/millcreator/README.md", "644"],
  ["../../LICENSE", "usr/share/doc/millcreator/LICENSE", "644"],
  ["../../LICENSE-APACHE", "usr/share/doc/millcreator/LICENSE-APACHE", "644"],
]

[dev-dependencies]
# Renders the UI headlessly to PNG for the README screenshots (see src/screenshots.rs).
egui_kittest = { version = "0.36", features = ["wgpu"] }
